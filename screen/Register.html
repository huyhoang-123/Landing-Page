<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/images/LogoIcon.png" />
    <link rel="stylesheet" href="/assets/sass/style.css" />
    <title id="pageTitle">Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="form-validation">
      <div class="cover-img">
        <img src="/assets/images/Image-container.png" alt="cover-img" />
      </div>
      <div class="register-form">
        <h2>Registration</h2>
        <form action="#">
          <div class="form-validation__field-box">
            <input type="text" placeholder="Enter your name" required />
          </div>
          <div class="form-validation__field-box">
            <input type="email" placeholder="Enter your email" required />
          </div>
          <div class="form-validation__field-box">
            <input type="text" placeholder="Address" required />
          </div>
          <div class="form-validation__field-box">
            <input type="tel" placeholder="Phone Number" required />
          </div>
          <div class="form-validation__field-box">
            <input type="password" placeholder="Create password" required />
          </div>
          <div class="form-validation__field-box">
            <input type="password" placeholder="Confirm password" required />
          </div>
          <div class="form-validation__policy">
            <input type="checkbox" />
            <p>I accept all terms & condition</p>
          </div>
          <button class="form-validation__button">Register Now</button>
          <div class="form-validation__login">
            <p>
              Already have an account?
              <a href="#" onclick="toggleButton('Login')">Login now</a>
            </p>
          </div>
        </form>
      </div>
      <div class="Login-form">
        <h2>Login</h2>
        <form action="#">
          <div class="form-validation__field-box">
            <input type="email" placeholder="Enter your email" required />
          </div>
          <div class="form-validation__field-box">
            <input type="password" placeholder="Enter password" required />
          </div>
          <button class="form-validation__button">Login Now</button>
          <div class="form-validation__login">
            <p>
              Don't have an account?
              <a href="#" onclick="toggleButton('Register')">Register now</a>
            </p>
          </div>
        </form>
      </div>
    </div>
    <script src="/script/script.js"></script>
  </body>
</html>
